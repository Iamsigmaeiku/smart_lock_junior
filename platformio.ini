; PlatformIO Project Configuration File
; 
; ESP32智慧門鎖學習專案
; 硬體: ESP32-S + MFRC522 + AS608 + SG90 + ILI9341(ST7789)
;
; 學習資源:
; - PlatformIO文檔: https://docs.platformio.org/en/latest/platforms/espressif32.html
; - ESP32 Arduino Core: https://github.com/espressif/arduino-esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 串列通訊設定 (用於Debug與上傳)
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/cu.usbserial-0001

lib_deps = 
    ; MFRC522 RFID讀卡器
    ; 參考: https://github.com/miguelbalboa/rfid
    ; Datasheet: MFRC522 Section 8.1 (SPI Interface)
    miguelbalboa/MFRC522@^1.4.10
    
    ; AS608指紋感應器
    ; 參考: https://github.com/adafruit/Adafruit-Fingerprint-Sensor-Library
    ; Manual: AS608用戶手冊 Section 4 (Communication Protocol)
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.0
    
    ; TFT_eSPI顯示器驅動 (支援ST7789)
    ; 參考: https://github.com/Bodmer/TFT_eSPI
    ; Datasheet: ST7789V2 Section 8.4 (SPI Interface)
    bodmer/TFT_eSPI@^2.5.43
    
    ; ESP32 Servo伺服馬達控制
    ; 參考: https://github.com/madhephaestus/ESP32Servo
    ; Technical: ESP32 TRM Section 14 (LED PWM Controller)
    madhephaestus/ESP32Servo@^3.0.5

; TFT_eSPI顯示器配置與編譯選項
; 這些設定會覆蓋TFT_eSPI/User_Setup.h的預設值
build_flags = 
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
