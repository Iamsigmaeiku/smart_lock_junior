; PlatformIO Project Configuration File
; 
; ESP32智慧門鎖學習專案
; 硬體: ESP32-S + MFRC522 + AS608 + SG90 + ILI9341(ST7789)
;
; 學習資源:
; - PlatformIO文檔: https://docs.platformio.org/en/latest/platforms/espressif32.html
; - ESP32 Arduino Core: https://github.com/espressif/arduino-esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 串列通訊設定 (用於Debug與上傳)
monitor_speed = 115200
upload_speed = 921600

; 編譯選項與庫依賴
lib_deps = 
    ; MFRC522 RFID讀卡器
    ; 參考: https://github.com/miguelbalboa/rfid
    ; Datasheet: MFRC522 Section 8.1 (SPI Interface)
    miguelbalboa/MFRC522@^1.4.10
    
    ; AS608指紋感應器
    ; 參考: https://github.com/adafruit/Adafruit-Fingerprint-Sensor-Library
    ; Manual: AS608用戶手冊 Section 4 (Communication Protocol)
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.0
    
    ; TFT_eSPI顯示器驅動 (支援ST7789)
    ; 參考: https://github.com/Bodmer/TFT_eSPI
    ; Datasheet: ST7789V2 Section 8.4 (SPI Interface)
    bodmer/TFT_eSPI@^2.5.43
    
    ; ESP32 Servo伺服馬達控制
    ; 參考: https://github.com/madhephaestus/ESP32Servo
    ; Technical: ESP32 TRM Section 14 (LED PWM Controller)
    madhephaestus/ESP32Servo@^3.0.5

; TFT_eSPI顯示器配置與編譯選項
; 這些設定會覆蓋TFT_eSPI/User_Setup.h的預設值
; ST7789V2 Datasheet Section 9 (Display Commands)
build_flags = 
    ; 基本驅動設定
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    
    ; 顯示器尺寸
    ; ST7789V2 Section 8.2 (Resolution: 240x320)
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    
    ; SPI接腳定義 (與MFRC522共用SPI匯流排)
    ; ESP32 VSPI: MOSI=23, MISO=19, SCK=18
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15      ; Chip Select (片選)
    -D TFT_DC=2       ; Data/Command (資料/命令切換)
    -D TFT_RST=4      ; Reset (重置)
    -D TFT_BL=-1      ; Backlight (背光，-1表示不使用PWM控制)
    
    ; SPI速度設定
    ; ST7789V2 Section 8.4.1: 最大SPI時鐘頻率 = 15MHz (寫入)
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    
    ; 字型設定
    -D LOAD_GLCD=1    ; 基本字型
    -D LOAD_FONT2=1   ; Small 16 pixel high font
    -D LOAD_FONT4=1   ; Medium 26 pixel high font
    -D LOAD_FONT6=1   ; Large 48 pixel high font
    -D LOAD_FONT7=1   ; 7-segment 48 pixel high font
    -D LOAD_FONT8=1   ; Large 75 pixel high font
    -D LOAD_GFXFF=1   ; FreeFonts字型
    
    ; 平滑字型渲染
    -D SMOOTH_FONT=1
    
    ; 除錯等級設定 (可選: 0=None, 1=Error, 2=Warn, 3=Info, 4=Debug, 5=Verbose)
    -D CORE_DEBUG_LEVEL=3

; 分區配置 (為大型程式預留空間)
board_build.partitions = default.csv